# folio-assistant-sci's harness checks on every pull request.
#
# Owner, 2026-10-14: "There should be CI running", and ("1") through ONE
# reusable workflow the harness owns, not a copy per repository; and "A
# harnessed repo should run not just core but all of the checks in the
# dependency harness".
#
# Until now this layer had no pull-request CI at all.
#
# The checks themselves live in cat-harness-tools
# (`.github/workflows/layer-pr-checks.yml`): folio-assistant-sci swapped into the
# folio-assistant index; typecheck; its tests; and the gates of folio-assistant-sci and
# its whole dependency harness, failing only on what this PR newly breaks.
name: Harness PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@main
    with:
      instance: folio-assistant-sci
      path-in-repo: .
      tools-ref: main
      # folio-assistant main pins pre-70lx layers until folio-assistant#2529 merges.
      index-ref: claude/nifty-johnson-w3mspn
